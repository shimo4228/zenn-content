[project]
name = "session-theme-mining"
version = "0.1.0"
description = "Deterministic transcript catalog for the session-theme-mining skill"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyright>=1.1.0",
  "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--cov=scripts", "--cov-report=term-missing", "--cov-fail-under=80"]
markers = [
  "unit: fast pure-python unit tests",
  "integration: CLI and cache integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# root ruff.toml と同じ明示 select を pin し、この project 固有の T20 を足す。
# `extend-select` だと base が ruff の**既定**(0.16 で 413 rule) になり、pin が閉じようと
# した「既定に委ねるとゲートの判定が版更新で動く」穴がここだけ開いたままになる。
# C901 は複雑度予算 (ADR-0056)。予算は **上げずに刈る** — 超過したら閾値でなく
# コードを縮める。閾値と実測分布の as-of は .claude/verify.md。
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "T20"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"scripts/session_catalog.py" = ["T201"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["scripts"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ty.environment]
# 直接スクリプト実行 (`python3 scripts/<name>.py`) を支える兄弟 import は、`scripts/` が
# sys.path[0] になる前提で書かれている (`if __package__:` の else 枝)。ty にも同じ入口を
# 教えないと、その枝が丸ごと unresolved-import になる — 経路は実在するので抑制ではなく
# 解決先の宣言。
root = [".", "scripts"]
