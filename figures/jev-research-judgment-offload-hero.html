<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>hero</title></head><body><div class="stage">
<h1>採点係には、答案と一緒に問題用紙を渡す</h1>
<div class="sub">Jev に「関係あるか」と聞くときは、何に対してかを一緒に渡す</div>
<svg viewBox="0 0 1600 900">
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/></marker>
<marker id="ma" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e07a1f"/></marker></defs>
<path class="arrow gray" d="M470,375 L590,375" marker-end="url(#m)"/>
<path class="arrow gray" d="M1010,375 L1130,375" marker-end="url(#m)"/>
<path class="arrow acc" d="M470,655 L590,655" marker-end="url(#ma)"/>
<path class="arrow acc" d="M1010,655 L1130,655" marker-end="url(#ma)"/>
</svg>
<div class="card gray" style="left:72px;top:300px;width:390px"><span class="tag gray">答案だけ</span><div class="big">資料 1 件</div></div>
<div class="card gray" style="left:600px;top:300px;width:400px"><span class="tag gray">採点係</span><div class="big">Jev</div></div>
<div class="card gray" style="left:1140px;top:300px;width:390px"><span class="tag gray">答え</span><div class="big">何に対して？</div><div style="font-size:24px">比べる相手が無い</div></div>
<div class="card acc" style="left:72px;top:540px;width:390px"><span class="tag acc">答案 + 問題用紙</span><div class="big">資料 1 件<br>+ 問い 1 つ</div><div style="font-size:22px;color:#4b5563;margin-top:6px">範囲・除外・採用済みの証拠</div></div>
<div class="card acc" style="left:600px;top:580px;width:400px"><span class="tag acc">採点係</span><div class="big">Jev</div></div>
<div class="card acc" style="left:1140px;top:560px;width:390px"><span class="tag acc">答え</span><div class="big">段階つき</div><div style="font-size:24px">別の問題 / 同じ分野 /<br>同じ問題 / 同じ問い</div></div>
</div></body></html>
