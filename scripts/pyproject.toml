[project]
name = "devto-crosspost"
version = "0.2.0"
description = "Schedule-driven Dev.to cross-poster for EN Zenn articles"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-frontmatter>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "tests/*"]

[tool.coverage.report]
fail_under = 80
