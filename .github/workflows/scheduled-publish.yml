name: Scheduled Publish

on:
  schedule:
    # 07:00 JST = UTC 22:00 (previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  devto-crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-frontmatter python-dotenv httpx

      - name: Dev.to crosspost
        run: python scripts/scheduled_publish.py
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

      - name: Update schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/schedule.json
          git diff --cached --quiet || git commit -m "chore: update schedule.json after crosspost"
          git push
