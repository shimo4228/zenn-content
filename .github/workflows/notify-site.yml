# Tells the personal site (shimo4228.github.io) to rebuild when the publication feed changes, so a new article
# or essay appears in its writing list without waiting for the site's daily build.
# Needs the secret SITE_DISPATCH_TOKEN: a fine-grained token limited to shimo4228/shimo4228.github.io with
# Contents: Read and write. Without it this job does nothing and the site still picks the change up every morning.
name: Notify site

on:
  push:
    branches: [main]
    paths: [docs/publications.json]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set; the site's daily build will pick this up."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/shimo4228/shimo4228.github.io/dispatches \
            -d '{"event_type":"publications"}'
